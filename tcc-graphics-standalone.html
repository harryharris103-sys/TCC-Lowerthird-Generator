<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCC Graphics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --gold:#C9A227; --gold-soft:#E4C766;
  --cream:#F4EFE3; --muted:#A9AFC6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0D18;--fg:#F4EFE3;--panel:#ffffff08;--bd:#ffffff1a;}}
:root{--bg:#F4EFE3;--fg:#12162A;--panel:#fff2;--bd:#0002;}
:root[data-theme="dark"]{--bg:#0B0D18;--fg:#F4EFE3;--panel:#ffffff08;--bd:#ffffff1a;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{padding:20px 24px 4px;}
header h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.4rem;margin:0 0 2px;}
header p{margin:0;color:#6b7290;font-size:.85rem;}
main{display:flex;gap:20px;padding:16px 24px 32px;flex-wrap:wrap;max-width:1300px;margin:0 auto;}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px;}
.controls{width:290px;flex-shrink:0;}
.stagecol{flex:1;min-width:300px;}
.lib{width:280px;flex-shrink:0;max-height:640px;overflow-y:auto;}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.tabs button{flex:1 1 45%;padding:7px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--fg);font-family:inherit;font-size:.78rem;cursor:pointer;}
.tabs button.active{background:var(--gold);border-color:var(--gold);color:#12162A;font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:.76rem;font-weight:600;margin-bottom:4px;opacity:.8;}
.field input,.field textarea{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-family:inherit;font-size:.86rem;resize:vertical;}
.swatches{display:flex;gap:8px;margin:6px 0 14px;}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatches button.active{border-color:var(--fg);}
.row{display:flex;gap:8px;}
.row input{flex:1;}
.btn{padding:9px;border-radius:7px;border:none;font-weight:600;font-size:.85rem;cursor:pointer;}
.btn-primary{background:var(--fg);color:var(--bg);width:100%;margin-top:4px;}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--fg);}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:radial-gradient(120% 90% at 15% 10%,#38406b 0%,transparent 55%),linear-gradient(155deg,#181C33 0%,#0E1122 65%,#090B16 100%);}
.stage.export-mode{background:transparent !important;}
.tpl{position:absolute;inset:0;display:none;}
.tpl.active{display:block;}
/* lower third */
.lt{position:absolute;left:5%;bottom:9%;max-width:52%;padding:14px 22px 14px 20px;border-left:4px solid var(--gold);
  background:linear-gradient(90deg,#12162Ae6 0%,#12162Ab3 85%,transparent 100%);border-radius:2px;}
.lt .kicker{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:1rem;color:var(--gold-soft);margin:0 0 3px;}
.lt .main{font-weight:700;font-size:1.7rem;line-height:1.1;color:#F8F5EC;margin:0;}
.lt .sub{font-weight:400;font-size:.85rem;color:#C7CBE0;margin:5px 0 0;}
/* scripture */
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8% 12%;}
.sc .verse{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:1.55rem;line-height:1.5;color:#F8F5EC;}
.sc .ref{margin-top:16px;font-weight:600;letter-spacing:.02em;font-size:1rem;color:var(--gold-soft);}
.sc .rule{width:56px;height:3px;background:var(--gold);margin:18px auto 0;}
/* sermon */
.se{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6% 9%;}
.se .eyebrow{width:56px;height:3px;background:var(--gold);margin-bottom:18px;}
.se .title{font-weight:700;font-size:2.4rem;line-height:1.08;color:#F8F5EC;max-width:80%;}
.se .sub{margin-top:14px;font-family:'Fraunces',serif;font-style:italic;font-size:1.1rem;color:var(--gold-soft);}
/* offering / announcement */
.of{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6% 10%;}
.of .title{font-weight:700;font-size:1.9rem;color:#F8F5EC;margin-bottom:10px;}
.of .body{font-size:1.05rem;line-height:1.5;color:var(--muted);max-width:70%;}
.of .rule{width:56px;height:3px;background:var(--gold);margin-bottom:16px;}
footer{padding:6px 24px 22px;color:#6b7290;font-size:.78rem;max-width:1300px;margin:0 auto;}
.libitem{border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-bottom:8px;}
.libitem .t{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;opacity:.55;}
.libitem .n{font-weight:600;font-size:.86rem;margin:2px 0 6px;}
.libitem .row{gap:6px;}
.libitem button{flex:1;padding:5px;font-size:.74rem;border-radius:5px;}
.libtabs{display:flex;gap:6px;margin-bottom:12px;}
.libtabs button{flex:1;padding:6px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--fg);font-size:.78rem;cursor:pointer;}
.libtabs button.active{background:var(--fg);color:var(--bg);}
.empty{font-size:.8rem;opacity:.55;padding:8px 2px;}
@media(max-width:900px){main{flex-direction:column;}.controls,.lib{width:100%;}}
</style>
</head>
<body>
<header><h1>TCC graphics</h1><p>Lower thirds, scripture cards, sermon titles and announcements — save presets, reuse past ones, export straight to OBS.</p></header>
<main>
  <div class="panel controls">
    <div class="tabs" id="typeTabs">
      <button data-t="lowerthird" class="active">Lower third</button>
      <button data-t="scripture">Scripture card</button>
      <button data-t="sermon">Sermon title</button>
      <button data-t="offering">Announcement</button>
    </div>
    <div id="fields"></div>
    <div class="field"><label>Accent</label>
      <div class="swatches">
        <button data-c="#C9A227,#E4C766" class="active" style="background:#C9A227"></button>
        <button data-c="#8E3B46,#D98A93" style="background:#8E3B46"></button>
        <button data-c="#2F6F5E,#8FC9B7" style="background:#2F6F5E"></button>
        <button data-c="#3E5C9A,#9BB4E0" style="background:#3E5C9A"></button>
      </div>
    </div>
    <div class="field"><label>Save as preset</label>
      <div class="row"><input type="text" id="presetName" placeholder="e.g. Pastor Mensah"><button class="btn btn-ghost" id="savePreset">Save</button></div>
    </div>
    <button class="btn btn-primary" id="download">Download PNG</button>
  </div>

  <div class="stagecol">
    <div class="panel" style="padding:12px;">
      <div class="stage" id="stage">
        <div class="tpl active" id="tpl-lowerthird">
          <div class="lt"><p class="kicker" id="lt-kicker"></p><p class="main" id="lt-main"></p><p class="sub" id="lt-sub"></p></div>
        </div>
        <div class="tpl" id="tpl-scripture">
          <div class="sc"><p class="verse" id="sc-verse"></p><div class="rule"></div><p class="ref" id="sc-ref"></p></div>
        </div>
        <div class="tpl" id="tpl-sermon">
          <div class="se"><div class="eyebrow"></div><p class="title" id="se-title"></p><p class="sub" id="se-sub"></p></div>
        </div>
        <div class="tpl" id="tpl-offering">
          <div class="of"><div class="rule"></div><p class="title" id="of-title"></p><p class="body" id="of-body"></p></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel lib">
    <div class="libtabs">
      <button class="active" data-k="preset">Presets</button>
      <button data-k="history">History</button>
    </div>
    <div id="libList"><div class="empty">Loading…</div></div>
  </div>
</main>
<footer>Lower thirds export with a transparent background for OBS. Other cards export as full opaque slides. Presets and history save in this browser only.</footer>

<script>
const FIELD_DEFS = {
  lowerthird: [
    {id:'kicker', label:'Kicker line', type:'text', def:'Word ministration by'},
    {id:'main', label:'Main line', type:'text', def:'Pastor John Mensah'},
    {id:'sub', label:'Secondary line', type:'text', def:'Sunday Service · Tema Christian Centre'},
  ],
  scripture: [
    {id:'verse', label:'Verse text', type:'textarea', def:'For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life.'},
    {id:'ref', label:'Reference', type:'text', def:'John 3:16'},
  ],
  sermon: [
    {id:'title', label:'Sermon title', type:'text', def:'Rooted & Established'},
    {id:'sub', label:'Speaker / date', type:'text', def:'Pastor John Mensah · Sunday Service'},
  ],
  offering: [
    {id:'title', label:'Title', type:'text', def:'Giving & Offering'},
    {id:'body', label:'Body text', type:'textarea', def:'You can give online at tcc.org/give or via the offering baskets during service. Thank you for your faithfulness.'},
  ],
};
const LABEL_FIELD = {lowerthird:'main', scripture:'ref', sermon:'title', offering:'title'};

let currentType = 'lowerthird';
let values = {};
for (const t in FIELD_DEFS){ values[t] = {}; FIELD_DEFS[t].forEach(f=>values[t][f.id]=f.def); }

const fieldsEl = document.getElementById('fields');
function renderFields(){
  fieldsEl.innerHTML = FIELD_DEFS[currentType].map(f=>{
    const val = values[currentType][f.id];
    return f.type==='textarea'
      ? `<div class="field"><label>${f.label}</label><textarea rows="3" data-id="${f.id}">${val}</textarea></div>`
      : `<div class="field"><label>${f.label}</label><input type="text" data-id="${f.id}" value="${val.replace(/"/g,'&quot;')}"></div>`;
  }).join('');
  fieldsEl.querySelectorAll('[data-id]').forEach(el=>{
    el.addEventListener('input', ()=>{ values[currentType][el.dataset.id]=el.value; syncPreview(); });
  });
}

function syncPreview(){
  document.querySelectorAll('.tpl').forEach(t=>t.classList.remove('active'));
  document.getElementById('tpl-'+currentType).classList.add('active');
  const v = values[currentType];
  if(currentType==='lowerthird'){
    lt_kicker.textContent=v.kicker; lt_main.textContent=v.main||'\u00A0';
    lt_sub.textContent=v.sub; lt_sub.style.display=v.sub?'block':'none';
  } else if(currentType==='scripture'){
    sc_verse.textContent='\u201C'+v.verse+'\u201D'; sc_ref.textContent=v.ref;
  } else if(currentType==='sermon'){
    se_title.textContent=v.title; se_sub.textContent=v.sub;
  } else if(currentType==='offering'){
    of_title.textContent=v.title; of_body.textContent=v.body;
  }
}
const lt_kicker=document.getElementById('lt-kicker'), lt_main=document.getElementById('lt-main'), lt_sub=document.getElementById('lt-sub');
const sc_verse=document.getElementById('sc-verse'), sc_ref=document.getElementById('sc-ref');
const se_title=document.getElementById('se-title'), se_sub=document.getElementById('se-sub');
const of_title=document.getElementById('of-title'), of_body=document.getElementById('of-body');

document.getElementById('typeTabs').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#typeTabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); currentType=b.dataset.t;
  renderFields(); syncPreview();
});
document.querySelectorAll('.swatches button').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.swatches button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const [g,s]=btn.dataset.c.split(',');
    document.documentElement.style.setProperty('--gold',g);
    document.documentElement.style.setProperty('--gold-soft',s);
  };
});

// ---- storage: localStorage (per-browser, no server needed) ----
const STORE_KEY = 'tcc-graphics-items-v1';
function loadItems(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }catch(e){ return []; } }
function saveItems(items){ localStorage.setItem(STORE_KEY, JSON.stringify(items)); }

const dlBtn=document.getElementById('download');
const saveBtn=document.getElementById('savePreset');
loadLib();

let libKind='preset';
document.querySelector('.libtabs').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('.libtabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); libKind=b.dataset.k; loadLib();
});

async function loadLib(){
  const libList=document.getElementById('libList');
  const items = loadItems().filter(i=>i.kind===libKind).sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);
  if(!items.length){ libList.innerHTML='<div class="empty">Nothing saved yet.</div>'; return; }
  libList.innerHTML='';
  items.forEach(it=>{
    const div = document.createElement('div');
    div.className='libitem';
    div.innerHTML = `<div class="t">${it.type}</div><div class="n">${(it.name||'Untitled').replace(/</g,'&lt;')}</div>
      <div class="row"><button class="btn btn-ghost load">Load</button><button class="btn btn-ghost del">Delete</button></div>`;
    div.querySelector('.load').onclick=()=>{
      currentType=it.type; values[it.type]=Object.assign({}, it.values);
      document.querySelectorAll('#typeTabs button').forEach(x=>x.classList.toggle('active', x.dataset.t===it.type));
      if(it.accent){ document.documentElement.style.setProperty('--gold', it.accent[0]); document.documentElement.style.setProperty('--gold-soft', it.accent[1]); }
      renderFields(); syncPreview();
    };
    div.querySelector('.del').onclick=()=>{
      saveItems(loadItems().filter(x=>x.id!==it.id));
      loadLib();
    };
    libList.appendChild(div);
  });
}

saveBtn.onclick=()=>{
  const nameInput=document.getElementById('presetName');
  const name = nameInput.value.trim() || values[currentType][LABEL_FIELD[currentType]] || 'Untitled';
  const accent=[getComputedStyle(document.documentElement).getPropertyValue('--gold').trim(), getComputedStyle(document.documentElement).getPropertyValue('--gold-soft').trim()];
  const items = loadItems();
  items.push({id:'p'+Date.now()+Math.random().toString(36).slice(2), kind:'preset', type:currentType, name, values:values[currentType], accent, createdAt:Date.now()});
  saveItems(items);
  nameInput.value='';
  if(libKind==='preset') loadLib();
};

dlBtn.onclick=async ()=>{
  const original=dlBtn.textContent;
  const stageEl=document.getElementById('stage');
  const transparent = currentType==='lowerthird';
  try{
    if(transparent) stageEl.classList.add('export-mode');
    const canvas=await html2canvas(stageEl,{backgroundColor: transparent?null:'#0E1122', scale:2});
    stageEl.classList.remove('export-mode');
    const name = values[currentType][LABEL_FIELD[currentType]] || currentType;
    const filename = ('tcc-'+currentType+'-'+name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'.png';
    const link=document.createElement('a');
    link.download=filename;
    link.href=canvas.toDataURL('image/png');
    link.click();
    dlBtn.textContent='Saved!';
    const accent=[getComputedStyle(document.documentElement).getPropertyValue('--gold').trim(), getComputedStyle(document.documentElement).getPropertyValue('--gold-soft').trim()];
    const items = loadItems();
    items.push({id:'h'+Date.now()+Math.random().toString(36).slice(2), kind:'history', type:currentType, name, values:values[currentType], accent, createdAt:Date.now()});
    saveItems(items);
    if(libKind==='history') loadLib();
    setTimeout(()=>{ dlBtn.textContent=original; }, 1800);
  }catch(e){
    dlBtn.textContent=original;
    alert('Could not export — try again.');
  }finally{
    stageEl.classList.remove('export-mode');
  }
};

renderFields(); syncPreview();
</script>
</body>
</html>
